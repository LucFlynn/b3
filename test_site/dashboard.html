<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPI — Live Lead Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'SF Mono', Monaco, Consolas, monospace; background: #0d1117; color: #c9d1d9; }
    .header { padding: 20px 24px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; color: #58a6ff; }
    .header .dot { width: 10px; height: 10px; background: #3fb950; border-radius: 50%; display: inline-block; margin-right: 8px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 20px 24px; }
    .stat { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 16px; }
    .stat .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
    .stat .value.green { color: #3fb950; }
    .stat .value.yellow { color: #d29922; }
    .stat .value.red { color: #f85149; }
    .stat .value.blue { color: #58a6ff; }
    .section { padding: 16px 24px; }
    .section h2 { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 8px 12px; color: #8b949e; border-bottom: 1px solid #21262d; font-weight: 600; }
    td { padding: 10px 12px; border-bottom: 1px solid #21262d; }
    tr:hover { background: #161b22; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-verified { background: #0d3321; color: #3fb950; }
    .badge-likely_real { background: #1c2d1e; color: #56d364; }
    .badge-suspicious { background: #2d2100; color: #d29922; }
    .badge-junk { background: #3d1214; color: #f85149; }
    .badge-definitive { background: #0c2d6b; color: #58a6ff; }
    .badge-high_confidence { background: #0c2d4b; color: #79c0ff; }
    .badge-probable { background: #1c1d2e; color: #a5b4fc; }
    .badge-unattributed { background: #1c1c1c; color: #8b949e; }
    .refresh-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .refresh-btn:hover { background: #30363d; }
    .empty { text-align: center; padding: 40px; color: #484f58; }
    .auto { font-size: 0.75rem; color: #484f58; margin-left: 12px; }
  </style>
</head>
<body>

<div class="header">
  <h1><span class="dot"></span>EPI Live Lead Monitor</h1>
  <div>
    <span class="auto" id="countdown">refreshes in 5s</span>
    <button class="refresh-btn" onclick="refresh()">Refresh Now</button>
  </div>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="label">Total Leads</div><div class="value blue" id="s-total">—</div></div>
  <div class="stat"><div class="label">Verified</div><div class="value green" id="s-verified">—</div></div>
  <div class="stat"><div class="label">Likely Real</div><div class="value green" id="s-likely">—</div></div>
  <div class="stat"><div class="label">Suspicious</div><div class="value yellow" id="s-suspicious">—</div></div>
  <div class="stat"><div class="label">Junk</div><div class="value red" id="s-junk">—</div></div>
  <div class="stat"><div class="label">Avg Score</div><div class="value blue" id="s-avg">—</div></div>
  <div class="stat"><div class="label">Attributed</div><div class="value green" id="s-attributed">—</div></div>
  <div class="stat"><div class="label">Duplicates</div><div class="value yellow" id="s-dupes">—</div></div>
</div>

<div class="section">
  <h2>Recent Leads</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Visitor</th>
        <th>Score</th>
        <th>Quality</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Attribution</th>
        <th>Source</th>
        <th>Bot?</th>
        <th>Dup?</th>
      </tr>
    </thead>
    <tbody id="leads-body">
      <tr><td colspan="10" class="empty">No leads yet. Go fill out the form on the test site!</td></tr>
    </tbody>
  </table>
</div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('epi_dash_token');
const API = 'http://localhost:8000';

if (!TOKEN) {
  // Auto-login
  fetch(API + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: 'live@demo.dev', password: 'demo1234' })
  })
  .then(r => r.json())
  .then(d => {
    localStorage.setItem('epi_dash_token', d.access_token);
    location.reload();
  })
  .catch(() => {
    document.getElementById('leads-body').innerHTML = '<tr><td colspan="10" class="empty">Could not authenticate. Pass ?token=YOUR_JWT in the URL.</td></tr>';
  });
} else {
  localStorage.setItem('epi_dash_token', TOKEN);
  refresh();
  // Auto-refresh every 5 seconds
  let countdown = 5;
  setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = `refreshes in ${countdown}s`;
    if (countdown <= 0) { countdown = 5; refresh(); }
  }, 1000);
}

async function refresh() {
  const headers = { 'Authorization': `Bearer ${TOKEN}` };

  try {
    const [statsResp, leadsResp] = await Promise.all([
      fetch(API + '/api/leads/stats', { headers }),
      fetch(API + '/api/leads?per_page=50', { headers }),
    ]);

    if (!statsResp.ok || !leadsResp.ok) {
      document.getElementById('leads-body').innerHTML = '<tr><td colspan="10" class="empty">Auth failed (token expired?). Reload the page.</td></tr>';
      return;
    }

    const stats = await statsResp.json();
    const leads = await leadsResp.json();

    document.getElementById('s-total').textContent = stats.total_leads;
    document.getElementById('s-verified').textContent = stats.verified;
    document.getElementById('s-likely').textContent = stats.likely_real;
    document.getElementById('s-suspicious').textContent = stats.suspicious;
    document.getElementById('s-junk').textContent = stats.junk;
    document.getElementById('s-avg').textContent = stats.avg_quality_score ?? '—';
    document.getElementById('s-attributed').textContent = stats.attributed;
    document.getElementById('s-dupes').textContent = stats.duplicates;

    const tbody = document.getElementById('leads-body');
    if (leads.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty">No leads yet. Go fill out the form on the test site!</td></tr>';
      return;
    }

    tbody.innerHTML = leads.map(l => `
      <tr>
        <td>${new Date(l.created_at).toLocaleTimeString()}</td>
        <td>${l.visitor_id.slice(0, 12)}</td>
        <td><strong>${l.quality_score ?? '—'}</strong>/100</td>
        <td><span class="badge badge-${l.quality_label}">${l.quality_label ?? '—'}</span></td>
        <td>${l.email_valid ?? '—'}</td>
        <td>${l.phone_valid ?? '—'}</td>
        <td><span class="badge badge-${l.attribution_tier}">${l.attribution_tier ?? '—'}</span></td>
        <td>${l.utm_source ?? '—'}${l.utm_medium ? '/' + l.utm_medium : ''}</td>
        <td>${l.is_bot ? '🤖' : '—'}</td>
        <td>${l.is_duplicate ? 'yes' : '—'}</td>
      </tr>
    `).join('');

  } catch(e) {
    console.error(e);
  }
}
</script>
</body>
</html>
